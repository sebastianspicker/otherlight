name: CI

on:
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "AGENTS.md"
      - "docs/archive/**"
      - "docs/audit/**"
      - "docs/architecture-map.md"
      - "docs/code-index.md"
      - "docs/deprecation-and-simplification-audit.md"
      - "docs/logic-and-correctness-audit.md"
      - "docs/verification-baseline.md"
      - "docs/deprecated/**"
      - "deprecated/**"
      - "node_modules/**"
      - "vendor/**"
      - "third_party/**"
      - "third-party/**"
      - "3rdparty/**"
      - "external/**"
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "AGENTS.md"
      - "docs/archive/**"
      - "docs/audit/**"
      - "docs/architecture-map.md"
      - "docs/code-index.md"
      - "docs/deprecation-and-simplification-audit.md"
      - "docs/logic-and-correctness-audit.md"
      - "docs/verification-baseline.md"
      - "docs/deprecated/**"
      - "deprecated/**"
      - "node_modules/**"
      - "vendor/**"
      - "third_party/**"
      - "third-party/**"
      - "3rdparty/**"
      - "external/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-22-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm ci:lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-22-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm ci:typecheck

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ matrix.node }}-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm ci:test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-22-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm ci:build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-22-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser E2E tests
        run: pnpm ci:e2e

  quality-gates:
    name: quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-22-

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Literature benchmarks
        run: pnpm literature-benchmarks

      - name: Didactics acceptance
        run: pnpm didactics-acceptance

      - name: Performance smoke
        run: pnpm perf-smoke

      - name: Physics regression
        run: pnpm physics-regression

      - name: Migration regression
        run: pnpm migration-regression
