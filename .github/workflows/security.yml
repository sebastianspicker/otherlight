name: Security

on:
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "AGENTS.md"
      - "docs/archive/**"
      - "docs/audit/**"
      - "docs/architecture-map.md"
      - "docs/code-index.md"
      - "docs/deprecation-and-simplification-audit.md"
      - "docs/logic-and-correctness-audit.md"
      - "docs/verification-baseline.md"
      - "docs/deprecated/**"
      - "deprecated/**"
      - "node_modules/**"
      - "vendor/**"
      - "third_party/**"
      - "third-party/**"
      - "3rdparty/**"
      - "external/**"
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "AGENTS.md"
      - "docs/archive/**"
      - "docs/audit/**"
      - "docs/architecture-map.md"
      - "docs/code-index.md"
      - "docs/deprecation-and-simplification-audit.md"
      - "docs/logic-and-correctness-audit.md"
      - "docs/verification-baseline.md"
      - "docs/deprecated/**"
      - "deprecated/**"
      - "node_modules/**"
      - "vendor/**"
      - "third_party/**"
      - "third-party/**"
      - "3rdparty/**"
      - "external/**"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
