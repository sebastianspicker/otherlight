<!-- ./index.html -->
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Improve UA default styling for form controls & scrollbars in light/dark contexts -->
    <meta name="color-scheme" content="dark light" />

    <!-- Optional but useful on mobile: matches your dark UI -->
    <meta name="theme-color" content="#0b0f14" />

    <title>Exoplanet–Exomoon Simulation (scientific core)</title>
  </head>

  <body>
    <div id="app">
      <div class="topbar">
        <button id="btnStart" type="button">Start</button>
        <button id="btnReset" type="button">Reset</button>

        <label class="lbl" for="timeSpeed">
          Time speed
          <input
            id="timeSpeed"
            type="range"
            min="1"
            max="5000"
            value="800"
            step="1"
            inputmode="numeric"
            aria-label="Time speed multiplier"
          />
          <span id="timeSpeedVal" aria-live="polite">800×</span>
        </label>

        <div class="readout" aria-live="polite">
          <div>t = <span id="tVal">0</span> s</div>
          <div>Flux = <span id="fluxVal">1.000000</span></div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h3>Sky plane (XY)</h3>
          <!-- width/height are a fallback "intrinsic" resolution; renderer handles HiDPI backing store -->
          <canvas
            id="skyCanvas"
            class="canvas-sky"
            width="640"
            height="640"
            aria-label="Sky-plane view (XY) of the system"
            role="img"
          ></canvas>
        </div>

        <div class="panel">
          <h3>Light curve (normalized)</h3>
          <canvas
            id="lcCanvas"
            class="canvas-lc"
            width="640"
            height="220"
            aria-label="Normalized light curve"
            role="img"
          ></canvas>
        </div>
      </div>
    </div>

    <!-- Vite entry: valid in dev/build, index.html is part of the module graph -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
